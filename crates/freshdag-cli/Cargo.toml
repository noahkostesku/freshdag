[package]
name = "freshdag-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "freshdag command-line interface."

[[bin]]
name = "freshdag"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
freshdag-core.workspace = true
freshdag-engine.workspace = true
freshdag-probes.workspace = true
freshdag-store.workspace = true
clap.workspace = true
# `freshdag coverage --json` serializes its report.
serde.workspace = true
serde_json.workspace = true
time.workspace = true
# `freshdag mark` mints an IR event, so it needs an event id and the
# artifact's content hash.
uuid.workspace = true
blake3.workspace = true

[dev-dependencies]
uuid.workspace = true
