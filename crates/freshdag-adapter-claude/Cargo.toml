[package]
name = "freshdag-adapter-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Claude Code adapter: consumes hook events and compiles them into FreshDAG's canonical execution IR."

[lints]
workspace = true

[[bin]]
name = "freshdag-claude-hook"
path = "src/bin/freshdag-claude-hook.rs"

[dependencies]
freshdag-core.workspace = true
# For publishing this adapter's coverage manifest into a store's
# `coverage.jsonl` (adapter-contract §Required Behavior 4). The event
# hot path deliberately does NOT go through the store: it keeps this
# crate's own buffered sink, which carries the never-block guarantee
# adapter-contract §Errors and Backpressure requires.
freshdag-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
blake3.workspace = true

[dev-dependencies]
tempfile = "3"
